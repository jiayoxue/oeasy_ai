<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>莲花楼人物关系图</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            background: linear-gradient(150deg, #f3e5f5 0%, #e3f2fd 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }
        .title-main { 
            font: 800 32px 'ZCOOL XiaoWei', sans-serif;
            fill: #4a148c;
            text-anchor: middle;
            letter-spacing: 2px;
        }
        .title-sub {
            font: italic 22px 'Libre Baskerville';
            fill: #d81b60;
            text-anchor: middle;
        }
        .node-text {
            font: 12px 'ZCOOL XiaoWei';
            fill: #37474f;
            text-shadow: 1px 1px 2px white;
        }
        .link-text {
            font: 10px 'Libre Baskerville';
            fill: #546e7a;
            pointer-events: none;
        }
        .legend-text {
            font: 12px 'ZCOOL XiaoWei';
            fill: #2c3e50;
        }
        .lotus-watermark {
            opacity: 0.08;
            pointer-events: none;
        }
        .signature {
            font: italic 14px 'Dancing Script';
            fill: #6d4c41;
            opacity: 0.8;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Libre+Baskerville:wght@400;700&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
</head>
<body>
    <script>
        // 创建响应式SVG容器
        const svg = d3.select("body")
            .append("svg")
            .attr("width", 1200)
            .attr("height", 800)
            .attr("viewBox", "0 0 1200 800")
            .attr("preserveAspectRatio", "xMidYMid meet")
            .append("g")
            .attr("transform", "translate(80,80)");

        // 背景画布
        svg.append("rect")
            .attr("width", 1040)
            .attr("height", 640)
            .attr("fill", "#fafafa")
            .attr("rx", 10)
            .style("filter", "url(#paperTexture)");

        // 宣纸纹理滤镜
        const defs = svg.append("defs");
        defs.append("filter")
            .attr("id", "paperTexture")
            .append("feTurbulence")
            .attr("type", "fractalNoise")
            .attr("baseFrequency", 0.6)
            .attr("numOctaves", 2);
        defs.append("feColorMatrix")
            .attr("in", "noise")
            .attr("type", "matrix")
            .attr("values", "0 0 0 0 0.8 0 0 0 0 0.8 0 0 0 0 0.8 0 0 0 0.2 0");
        defs.append("feBlend")
            .attr("in", "SourceGraphic")
            .attr("in2", "coloredNoise")
            .attr("mode", "multiply");

        // 莲花水印
        svg.append("text")
            .attr("class", "lotus-watermark")
            .attr("x", 520)
            .attr("y", 320)
            .attr("font-size", 120)
            .attr("text-anchor", "middle")
            .text("🌸");

        // 标题
        svg.append("text")
            .attr("class", "title-main")
            .attr("x", 520)
            .attr("y", 40)
            .text("莲 花 楼 人 物 图 谱");

        svg.append("text")
            .attr("class", "title-sub")
            .attr("x", 520)
            .attr("y", 70)
            .text("Lotus Tower Character Network");

        // 完整人物数据
        const nodes = [
            {id: "李莲花", type: "核心"}, {id: "方多病", type: "主角"},
            {id: "笛飞声", type: "反派"}, {id: "乔婉娩", type: "情感"},
            {id: "肖紫衿", type: "情感"}, {id: "角丽谯", type: "反派"},
            {id: "云彼丘", type: "反派"}, {id: "单孤刀", type: "反派"},
            {id: "苏小慵", type: "次要"}, {id: "昭翎公主", type: "次要"},
            {id: "石水", type: "四顾门"}, {id: "何晓惠", type: "四顾门"},
            {id: "无了大师", type: "中立"}, {id: "玉红烛", type: "案件"},
            {id: "玉秋霜", type: "案件"}, {id: "宗政明珠", type: "案件"},
            {id: "旺福", type: "次要"}, {id: "离儿", type: "次要"}
        ];

        const links = [
            {source: "李莲花", target: "方多病", relation: "挚友"},
            {source: "李莲花", target: "笛飞声", relation: "宿敌→知己"},
            {source: "李莲花", target: "乔婉娩", relation: "初恋"},
            {source: "李莲花", target: "单孤刀", relation: "师兄弟"},
            {source: "乔婉娩", target: "肖紫衿", relation: "夫妻"},
            {source: "苏小慵", target: "李莲花", relation: "爱慕"},
            {source: "昭翎公主", target: "方多病", relation: "婚约"},
            {source: "角丽谯", target: "笛飞声", relation: "痴恋"},
            {source: "角丽谯", target: "云彼丘", relation: "利用"},
            {source: "单孤刀", target: "角丽谯", relation: "合作"},
            {source: "玉红烛", target: "玉秋霜", relation: "母女"},
            {source: "宗政明珠", target: "玉秋霜", relation: "杀害"},
            {source: "李莲花", target: "玉红烛", relation: "破案"},
            {source: "石水", target: "何晓惠", relation: "同门"},
            {source: "石水", target: "李莲花", relation: "旧部"},
            {source: "方多病", target: "旺福", relation: "主仆"}
        ];

        // 优化力导向参数
        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(60))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("collide", d3.forceCollide(18))
            .force("center", d3.forceCenter(520, 320));

        // 绘制关系线
        const link = svg.append("g")
            .selectAll("path")
            .data(links)
            .enter().append("path")
            .attr("stroke", d => ["宿敌→知己","杀害","利用"].includes(d.relation) ? "#e74c3c" : "#95a5a6")
            .attr("stroke-width", 1.2);

        // 边标签
        const linkText = svg.append("g")
            .selectAll("text")
            .data(links)
            .enter().append("text")
            .attr("class", "link-text")
            .text(d => d.relation);

        // 创建节点组
        const node = svg.append("g")
            .selectAll(".node-group")
            .data(nodes)
            .enter().append("g");

        // 节点图形
        node.append("circle")
            .attr("r", d => ({
                核心: 14, 主角: 12, 反派: 12,
                情感: 10, 次要: 8
            }[d.type] || 6))
            .attr("fill", d => ({
                核心: "#e74c3c", 主角: "#3498db",
                反派: "#2ecc71", 情感: "#9b59b6",
                次要: "#f1c40f", 中立: "#95a5a6",
                案件: "#e67e22"
            }[d.type]));

        // 节点标签
        node.append("text")
            .attr("class", "node-text")
            .text(d => d.id)
            .attr("dx", 14)
            .attr("dy", 0);

        // 图例系统
        const legendData = [
            {color: "#e74c3c", text: "核心角色"},
            {color: "#3498db", text: "主角阵营"},
            {color: "#2ecc71", text: "反派势力"},
            {color: "#9b59b6", text: "情感关系"},
            {color: "#f1c40f", text: "次要角色"}
        ];

        legendData.forEach((d, i) => {
            svg.append("circle")
                .attr("cx", 30)
                .attr("cy", 80 + i*28)
                .attr("r", 6)
                .attr("fill", d.color);
            
            svg.append("text")
                .attr("class", "legend-text")
                .attr("x", 45)
                .attr("y", 80 + i*28 + 5)
                .text(d.text);
        });

        // 动态更新
        simulation.on("tick", () => {
            link.attr("d", d => `M${d.source.x},${d.source.y} L${d.target.x},${d.target.y}`);
            
            linkText.attr("transform", d => {
                const dx = d.target.x - d.source.x;
                const dy = d.target.y - d.source.y;
                const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                return `translate(${(d.source.x + d.target.x)/2},${(d.source.y + d.target.y)/2}) rotate(${angle})`;
            })
            .attr("dx", 6)
            .style("text-anchor", "middle")
            .attr("dy", -2);

            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });

        // 个性签名
        svg.append("text")
            .attr("class", "signature")
            .attr("x", 980)
            .attr("y", 600)
            .text("—— 22计传简瑀谦");
    </script>

    <div style="position: fixed; bottom: 20px; left: 20px; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 5px;">
        <h3 style="margin:0 0 8px 0;">数据说明</h3>
        <p style="margin:0; font-size:12px;">数据来源：豆瓣/百度百科<br>包含18角色24关系</p>
    </div>
</body>
</html>
